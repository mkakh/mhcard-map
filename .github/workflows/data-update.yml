name: Update Location Data

on:
  schedule:
    - cron: "0 18 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Snapshot current location data
        run: |
          mkdir -p .tmp
          cp data/locations.json .tmp/locations-before-update.json
      - name: Install OCR tools
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr imagemagick

          if command -v magick >/dev/null 2>&1; then
            echo "MAGICK_COMMAND=$(command -v magick)" >> "$GITHUB_ENV"
          elif command -v convert >/dev/null 2>&1; then
            echo "MAGICK_COMMAND=$(command -v convert)" >> "$GITHUB_ENV"
          else
            echo "::error::ImageMagick command not found"
            exit 1
          fi
      - name: Import GKP catalogue and retain official-first data
        id: import-gkp
        run: npm run import:gkp
      - name: Verify card image codes
        run: npm run verify:image-codes -- --warn-only
      - name: Normalize source links
        run: npm run normalize:links
      - name: Geocode locations
        run: npm run geocode
      - name: Sync reviewed geocode cache
        run: npm run sync:geocode-review-cache
      - name: Generate Plus Codes
        run: npm run update:codes
      - name: Import Google Form responses
        run: npm run import:forms
        env:
          GOOGLE_FORM_RESPONSES_CSV_URL: ${{ secrets.GOOGLE_FORM_RESPONSES_CSV_URL }}
      - name: Update site history
        run: npm run update:history -- --before .tmp/locations-before-update.json --source "Automated location data update"
      - name: Validate generated data
        id: validate
        continue-on-error: true
        run: |
          mkdir -p .tmp
          set -o pipefail
          npm run validate:data 2>&1 | tee .tmp/data-validation.log
      - name: Sync GKP review candidates
        if: ${{ !cancelled() && steps.import-gkp.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run sync:gkp-review-issue
      - name: Sync data-validation issue
        if: ${{ !cancelled() && (steps.validate.outcome == 'success' || steps.validate.outcome == 'failure') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATION_OUTCOME: ${{ steps.validate.outcome }}
        run: npm run sync:data-validation-issue
      - name: Preserve validation failure
        if: ${{ !cancelled() && steps.validate.outcome == 'failure' }}
        run: exit 1
      - name: Audit objective geocode issues
        run: npm run audit:geocode-review:issues
      - name: Summarize location changes
        run: node scripts/summarize-location-diff.js
      - name: Create update pull request
        id: create-pr
        uses: peter-evans/create-pull-request@v6
        with:
          branch: automation/location-data-update
          title: "chore: update location data"
          commit-message: "chore: update location data"
          body-path: .tmp/location-update-summary.md
          reviewers: mkakh
      - name: Sync review detail comments
        if: steps.create-pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-location-review-comments.js "${{ steps.create-pr.outputs.pull-request-number }}"
