name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare static files
        run: |
          mkdir -p dist
          cp index.html app.js card-catalog.js collection-backup.js app-utils.js styles.css dist/
          cp robots.txt sitemap.xml dist/
          cp favicon.ico manifest.webmanifest dist/
          cp -R icons dist/icons
          cp LICENSE NOTICE.md dist/
          cp CNAME dist/
          mkdir -p dist/data
          cp data/locations.json data/update-history.json data/update-form-config.json data/update-requests.json dist/data/
      - name: Set asset version
        run: |
          APP_VERSION="$(git rev-parse --short HEAD)"
          find dist -type f \( -name "*.html" -o -name "*.js" \) -print0 | xargs -0 sed -i "s/__APP_VERSION__/${APP_VERSION}/g"
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
